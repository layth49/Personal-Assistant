services:
  # 1. SearxNG - Private Search Engine
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw

  # 2. Kokoro FastAPI - Text-to-Speech
  #
  # Stays on the GPU. Measured 22-34x realtime here (7.3s of audio in ~250ms),
  # so it only touches the card in short bursts; moving it to the CPU freed
  # ~1 GB of VRAM but tripled time-to-first-audio (783ms -> 2717ms), which is
  # the wrong trade for a voice assistant. If VRAM ever has to be reclaimed,
  # DEVICE=cpu + USE_GPU=false switch this same image over with no image pull.
  kokoro:
    container_name: kokoro
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    ports:
      - "8880:8880"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 3. Parakeet - Speech-to-Text (what the assistant listens through)
  #
  # CPU-only by design: it beat whisper on the numbers that decide whether a
  # tool call is right AND leaves the whole 6 GB card to the LLM and Kokoro.
  # See stt-server/README.md for the bake-off table.
  #
  # CONTACTS_FILE (from .env) is the host path to the contacts JSON, mounted
  # read-only. Without it the decoder loses its contact-name boosting and name
  # recall drops from 75% to 41.7% — `curl http://localhost:8001/health` reports
  # `boost_phrases`, which reads 0 when that has happened.
  #
  # Deliberately NOT named CONTACTS_PATH: compose prefers a shell variable over
  # .env, so reusing the app's variable name means whatever is set in the user
  # environment silently wins over this file.
  stt:
    container_name: parakeet-stt
    build: ./stt-server
    ports:
      - "8001:8001"
    restart: unless-stopped
    environment:
      CONTACTS_PATH: /run/secrets/contacts.json
    volumes:
      - type: bind
        source: ${CONTACTS_FILE:?set CONTACTS_FILE in .env - see .env.example}
        target: /run/secrets/contacts.json
        read_only: true
        bind:
          # Never invent the source: a typo would otherwise get silently mounted
          # as an empty directory and the service would come up unboosted.
          create_host_path: false
      # The model is a ~2.4 GB download; keep it out of the image and alive
      # across rebuilds.
      - parakeet-models:/models

  # 4. Faster Whisper Server - Speech-to-Text (superseded)
  #
  # No longer what the assistant transcribes through: the bake-off picked
  # Parakeet. Kept behind a profile so it doesn't start by default and doesn't
  # hold ~2.2 GB of VRAM the LLM wants, but stays one command away for A/B runs:
  #
  #   docker compose --profile whisper up -d whisper
  #   $env:STT_URL = "http://localhost:8000"
  whisper:
    container_name: whisper
    image: fedirz/faster-whisper-server:latest-cuda
    profiles: ["whisper"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  parakeet-models:
